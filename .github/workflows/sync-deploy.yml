name: Sync & Deploy

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00（北京时间 08:00）自动同步上游并部署
  workflow_dispatch: # 可手动强制部署（即使上游无更新）

jobs:
  sync-and-deploy:
    name: Sync upstream then deploy if changed
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: shuaiplus/inkstone
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      # 门禁：上游有新版（同步产生新提交）或手动触发时才部署
      - name: Setup Node.js
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Build
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      # 数据保全：把已有的 D1 / KV / R2 资源 ID 注入构建产物，避免 wrangler 新建空库
      - name: Inject resource IDs (data safety)
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/prepare-wrangler-config.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          INKSTONE_D1_ID: ${{ secrets.INKSTONE_D1_ID }}
          INKSTONE_KV_ID: ${{ secrets.INKSTONE_KV_ID }}
          # 需要定时维护（备份/附件清理/索引）时填 cron，例如 "0 * * * *"；
          # Free 计划每账号仅 5 个 cron 名额，留空即不启用。
          INKSTONE_CRONS: ""
          # 只用自定义域名；设为 true 会重新启用 *.workers.dev 预览地址
          INKSTONE_WORKERS_DEV: "false"

      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.has_new_commits == 'true' || github.event_name == 'workflow_dispatch'
        run: npx wrangler deploy --config dist/inkstone/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
